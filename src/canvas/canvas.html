<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>canvas</title>
</head>
<body>
    <canvas width="480" height="320" tabindex="0"> </canvas>

    <script>
        const canvas = document.querySelector("canvas");
const ctx = canvas.getContext("2d");

function drawCircle(x, y, size) {
  ctx.fillStyle = "white";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.beginPath();
  ctx.fillStyle = "black";
  ctx.arc(x, y, size, 0, 2 * Math.PI);
  ctx.fill();
}

let x = 50;
let y = 50;
const size = 30;

drawCircle(x, y, size);
// Don't edit the code above here!

document.addEventListener("keydown", (event) =>{
    if (event.key === "w"){
        y -= 5;
        drawCircle(x, y, size);
    }
    else if (event.key === "s"){
        y += 5;
        drawCircle(x, y, size)
    }
    else if (event.key === "a"){
        x -= 5;
        drawCircle(x, y, size)
    }
    else if (event.key === "d"){
        x += 5;
        drawCircle(x, y, size)
    }
    else{
        return;
    }
})
    </script>
</body>
</html>
