<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>string2</title>
</head>
<body>
    <section></section>

    <script>

        const quote = "I do not like green eggs and ham. I do not like them, Sam-I-Am.";
        const substring = "green eggs and ham";
        
        // Don't edit the code above here!
        
        const quoteLength = quote.length;//paljon quote syönyt tilaa
        const index = quote.indexOf(substring);//missä substring aloitaa quotessa
        const revisedQuote = quote.slice(0, index + substring.length+1);//quotessa aloitus 0, 31+1 asti
        // slice on siis alkuun ja ennen loppuun asti
        
        // Don't edit the code below here!
        
        const section = document.querySelector("section");
        section.innerHTML = " ";
        const para1 = document.createElement("p");
        para1.textContent = `The quote is ${quoteLength} characters long.`;
        const para2 = document.createElement("p");
        para2.textContent = revisedQuote;
        section.appendChild(para1);
        section.appendChild(para2);

        
    </script>
</body>
</html>
